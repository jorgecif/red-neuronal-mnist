<meta charset="utf-8">
<title>MNIST paso a paso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Animación interactiva de una red neuronal real (784-16-16-10) que reconoce dígitos de MNIST: imagen, neurona, propagación, softmax, entrenamiento y dibujo libre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: aula de una sola pantalla. Barra de capítulos arriba, escenario (canvas) a la izquierda,
   columna de narración a la derecha; en teléfono se apilan. Mundo oscuro a propósito: las activaciones brillan. */
:root {
  --bg: #0a0f1e;
  --stage: #0b1122;
  --surface: #10182f;
  --surface-2: #172142;
  --line: #26335c;
  --ink: #eaeef8;
  --muted: #9aa5c6;
  --faint: #5d6890;
  --pos: #ffb547;   /* excitación: peso positivo, activación */
  --neg: #4cc3ff;   /* inhibición: peso negativo */
  --err: #ff5c8a;   /* error y gradiente */
  --ok: #4fe3a2;    /* respuesta correcta */
  --on-pos: #1d1405;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; max-width: 1720px; margin: 0 auto; }

/* barra superior */
.top { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand svg { width: 40px; height: 40px; flex: none; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.015em; margin: 0; line-height: 1.05; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 0.86rem; }
.chapters { display: flex; gap: 6px; flex-wrap: wrap; }
.chapters button {
  font: inherit; font-size: 0.88rem; color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 5px;
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
}
.chapters button .n {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink); font-weight: 700; font-size: 0.8rem; font-variant-numeric: tabular-nums;
}
.chapters button:hover { color: var(--ink); border-color: var(--faint); }
.chapters button[aria-current="step"] { color: var(--ink); border-color: var(--pos); background: var(--surface); }
.chapters button[aria-current="step"] .n { background: var(--pos); color: var(--on-pos); }
.chapters button.seen .n { box-shadow: inset 0 0 0 1.5px var(--faint); }
.fs { position: absolute; top: 10px; right: 10px; z-index: 2; width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.fs svg { width: 16px; height: 16px; }
.fs:hover { color: var(--ink); border-color: var(--muted); }

/* zona principal */
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 390px); gap: 16px; min-height: 0; }
.stage-col { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.stage-wrap { position: relative; flex: 1; min-height: 0; background: var(--stage); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
#stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 1rem; }
.samples { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; min-height: 44px; }
.samples .lbl { color: var(--muted); font-size: 0.85rem; margin-right: 4px; }
.thumb { width: 40px; height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: #000; cursor: pointer; overflow: hidden; flex: none; }
.thumb canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.thumb:hover { border-color: var(--muted); }
.thumb[aria-pressed="true"] { outline: 2px solid var(--pos); outline-offset: 1px; }

/* narración */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 14px; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: auto; }
.eyebrow { font-size: 0.76rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--pos); font-weight: 700; }
.panel h2 { font-family: var(--font-display); font-size: 1.65rem; line-height: 1.12; margin: -6px 0 0; text-wrap: balance; font-weight: 700; letter-spacing: -0.01em; }
.beat-text { font-size: 1.04rem; }
.beat-text p { margin: 0 0 0.65em; }
.beat-text p:last-child { margin-bottom: 0; }
.beat-text b { color: #fff; }
.beat-text .tip { color: var(--muted); font-size: 0.9rem; }
.beat-text .ok { color: var(--ok); }
.beat-text .bad { color: var(--err); }
.formula { font-family: var(--font-mono); font-size: 0.95rem; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-wrap: anywhere; line-height: 1.7; color: var(--ink); }
.formula var { font-style: italic; color: #fff; }
.formula sub, .formula sup { font-size: 0.72em; }
.extras { display: flex; flex-wrap: wrap; gap: 8px; }
.extras:empty { display: none; }
.extras .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
.extras .group > span { color: var(--muted); font-size: 0.84rem; margin-right: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.82rem; color: var(--muted); }
.legend:empty { display: none; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend span::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.btn {
  font: inherit; font-size: 0.92rem; font-weight: 700; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; line-height: 1.2;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--pos); color: var(--on-pos); border-color: var(--pos); }
.btn.primary:hover:not(:disabled) { border-color: #fff; }
.btn.small { font-size: 0.84rem; padding: 6px 10px; }
.btn[aria-pressed="true"] { border-color: var(--pos); color: var(--pos); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
:focus-visible { outline: 2px solid var(--neg); outline-offset: 2px; }
.controls { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.controls #nextBtn { margin-left: auto; }
.dots { display: flex; gap: 6px; width: 100%; justify-content: center; order: -1; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.done { background: var(--faint); }
.dots i.on { background: var(--pos); box-shadow: 0 0 8px var(--pos); }
.hint { margin: 0; font-size: 0.76rem; color: var(--faint); }

@media (max-width: 960px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .stage-wrap { flex: none; width: 100%; aspect-ratio: 1120 / 660; }
  .panel { overflow: visible; }
  .chapters button .lbl { display: none; }
  .chapters button { padding: 4px; }
  .hint { display: none; }
}
@media (max-width: 520px) {
  .brand h1 { font-size: 1.25rem; }
  .brand p { display: none; }
  .panel h2 { font-size: 1.4rem; }
}
</style>

<script>
(() => {
'use strict';

/* ======================================================================
   Datos reales: pesos de una red 784-16-16-10 entrenada con numpy sobre
   las 60 000 imágenes de MNIST, más 1 000 imágenes de prueba y 6 000 de
   entrenamiento (para entrenar en vivo en el navegador).
   ====================================================================== */
const MODEL = /*__MODEL__*/null;
const TEST_SPRITE = '__TEST_SPRITE__';
const TRAIN_SPRITE = '__TRAIN_SPRITE__';

const VW = 1120, VH = 660;
const ARCH = [784, 16, 16, 10];
const SEED = 20261017;
const ETA = 0.1, BATCH = 32, EPOCH = 6000, MAX_EPOCHS = 15;
const SPEEDS = [{ l: 'Lento', v: 0.2 }, { l: 'Normal', v: 1 }, { l: 'Rápido', v: 4 }, { l: 'Turbo', v: 8 }];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const prog = (t, dur, delay = 0) => (REDUCED ? 1 : clamp((t - delay) / dur));
const sgn = (v, d = 2) => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(d);
const num = (v, d = 2) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const pct = (p, d = 1) => (p * 100).toFixed(d) + ' %';
const grp = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const SUBS = '₀₁₂₃₄₅₆₇₈₉';
const sub = n => String(n).replace(/\d/g, d => SUBS[d]);
const lerpBox = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), s: lerp(a.s, b.s, t) });

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rng) { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); }
function b64f32(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Float32Array(u.buffer); }

/* ======================================================================
   La red neuronal (perceptrón multicapa) — el mismo cálculo que en numpy
   ====================================================================== */
class MLP {
  constructor(sizes) {
    this.sizes = sizes; this.L = sizes.length - 1;
    this.W = []; this.b = [];
    for (let l = 0; l < this.L; l++) { this.W.push(new Float32Array(sizes[l + 1] * sizes[l])); this.b.push(new Float32Array(sizes[l + 1])); }
    this.version = 0; this.seen = 0; this.scales = null;
  }
  static fromModel(m) {
    const n = new MLP(m.arch);
    m.W.forEach((s, l) => n.W[l].set(b64f32(s)));
    m.b.forEach((s, l) => n.b[l].set(b64f32(s)));
    for (const W of n.W) for (let k = 0; k < W.length; k++) if (Math.abs(W[k]) < 1e-30) W[k] = 0;
    n.scales = m.scales;
    return n;
  }
  randomize(seed) {  // inicialización de He: pesos ~ N(0, 2/entradas)
    const rng = mulberry32(seed);
    for (let l = 0; l < this.L; l++) {
      const sd = Math.sqrt(2 / this.sizes[l]), W = this.W[l];
      for (let k = 0; k < W.length; k++) W[k] = gauss(rng) * sd;
      this.b[l].fill(0);
    }
    this.version++; this.seen = 0;
  }
  clone() { const n = new MLP(this.sizes); this.W.forEach((w, l) => n.W[l].set(w)); this.b.forEach((b, l) => n.b[l].set(b)); n.seen = this.seen; return n; }
  copyFrom(o) { o.W.forEach((w, l) => this.W[l].set(w)); o.b.forEach((b, l) => this.b[l].set(b)); this.seen = o.seen; this.version++; }
  forward(x) {
    const z = [], a = [x]; let cur = x;
    for (let l = 0; l < this.L; l++) {
      const nin = this.sizes[l], nout = this.sizes[l + 1], W = this.W[l], b = this.b[l];
      const zl = new Float32Array(nout);
      for (let j = 0; j < nout; j++) { let s = b[j]; const o = j * nin; for (let i = 0; i < nin; i++) s += W[o + i] * cur[i]; zl[j] = s; }
      z.push(zl);
      if (l < this.L - 1) { const al = new Float32Array(nout); for (let j = 0; j < nout; j++) al[j] = zl[j] > 0 ? zl[j] : 0; a.push(al); cur = al; }
    }
    const zo = z[this.L - 1]; let m = -Infinity; for (const v of zo) if (v > m) m = v;
    const p = new Float32Array(zo.length); let s = 0;
    for (let k = 0; k < zo.length; k++) { p[k] = Math.exp(zo[k] - m); s += p[k]; }
    for (let k = 0; k < p.length; k++) p[k] /= s;
    let pred = 0; for (let k = 1; k < p.length; k++) if (p[k] > p[pred]) pred = k;
    return { x, z, a, p, pred };
  }
  // Retropropagación de un solo ejemplo. delta[l][j] = ∂L/∂z de la neurona j de la capa l+1.
  backward(F, y) {
    const L = this.L, delta = new Array(L);
    const dOut = Float32Array.from(F.p); dOut[y] -= 1; delta[L - 1] = dOut;
    for (let l = L - 1; l > 0; l--) {
      const nin = this.sizes[l], nout = this.sizes[l + 1], W = this.W[l], d = delta[l];
      const dp = new Float32Array(nin);
      for (let i = 0; i < nin; i++) { if (F.z[l - 1][i] <= 0) continue; let s = 0; for (let j = 0; j < nout; j++) s += W[j * nin + i] * d[j]; dp[i] = s; }
      delta[l - 1] = dp;
    }
    return delta;  // ∂L/∂W[l][j,i] = delta[l][j] · a[l][i]
  }
  applyGrad(F, delta, lr) {
    for (let l = 0; l < this.L; l++) {
      const nin = this.sizes[l], nout = this.sizes[l + 1], W = this.W[l], b = this.b[l], A = F.a[l], d = delta[l];
      for (let j = 0; j < nout; j++) { const dj = d[j]; if (!dj) continue; b[j] -= lr * dj; const o = j * nin; for (let i = 0; i < nin; i++) if (A[i]) W[o + i] -= lr * dj * A[i]; }
    }
    this.version++;
  }
}

/* Entrenamiento por mini-lotes con descenso del gradiente estocástico (sin trucos extra). */
class Trainer {
  constructor(net, X, Y, n, seed) {
    this.net = net; this.X = X; this.Y = Y; this.n = n; this.rng = mulberry32(seed);
    this.order = new Uint32Array(n); for (let i = 0; i < n; i++) this.order[i] = i;
    const s = net.sizes;
    this.z = s.slice(1).map(k => new Float32Array(k));
    this.a = s.slice(1).map(k => new Float32Array(k));
    this.d = s.slice(1).map(k => new Float32Array(k));
    this.gW = net.W.map(w => new Float32Array(w.length));
    this.gb = net.b.map(b => new Float32Array(b.length));
    this.reset();
  }
  reset() { this.pos = 0; this.rng = mulberry32(7); this.shuffle(); }
  shuffle() { const o = this.order; for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(this.rng() * (i + 1)); const t = o[i]; o[i] = o[j]; o[j] = t; } }
  batch(B, lr) {
    const net = this.net, s = net.sizes, L = net.L;
    for (const g of this.gW) g.fill(0);
    for (const g of this.gb) g.fill(0);
    let loss = 0;
    for (let q = 0; q < B; q++) {
      const idx = this.order[this.pos++];
      if (this.pos >= this.n) { this.pos = 0; this.shuffle(); }
      const x = this.X.subarray(idx * 784, idx * 784 + 784), y = this.Y[idx];
      let cur = x;
      for (let l = 0; l < L; l++) {  // hacia adelante
        const nin = s[l], nout = s[l + 1], W = net.W[l], b = net.b[l], z = this.z[l], a = this.a[l], last = l === L - 1;
        for (let j = 0; j < nout; j++) { let v = b[j]; const o = j * nin; for (let i = 0; i < nin; i++) v += W[o + i] * cur[i]; z[j] = v; a[j] = last ? v : (v > 0 ? v : 0); }
        cur = a;
      }
      const zo = this.a[L - 1], dO = this.d[L - 1];  // softmax + entropía cruzada
      let m = -Infinity; for (let k = 0; k < zo.length; k++) if (zo[k] > m) m = zo[k];
      let sum = 0; for (let k = 0; k < zo.length; k++) { dO[k] = Math.exp(zo[k] - m); sum += dO[k]; }
      for (let k = 0; k < zo.length; k++) dO[k] /= sum;
      loss -= Math.log(dO[y] + 1e-9);
      dO[y] -= 1;  // δ salida = p − y
      for (let l = L - 1; l >= 0; l--) {  // hacia atrás
        const nin = s[l], nout = s[l + 1], W = net.W[l], d = this.d[l], gW = this.gW[l], gb = this.gb[l];
        const prev = l === 0 ? x : this.a[l - 1];
        for (let j = 0; j < nout; j++) { const dj = d[j]; if (dj === 0) continue; gb[j] += dj; const o = j * nin; for (let i = 0; i < nin; i++) { const v = prev[i]; if (v !== 0) gW[o + i] += dj * v; } }
        if (l > 0) {
          const dp = this.d[l - 1], zp = this.z[l - 1];
          for (let i = 0; i < nin; i++) { if (zp[i] <= 0) { dp[i] = 0; continue; } let v = 0; for (let j = 0; j < nout; j++) v += W[j * nin + i] * d[j]; dp[i] = v; }
        }
      }
    }
    const k = lr / B;  // w ← w − η · (promedio del gradiente)
    for (let l = 0; l < L; l++) {

/* Capítulo 5: una red nueva, al azar, y un solo paso de descenso del gradiente para mostrarlo */

  }
}

/* Preprocesado igual que MNIST: recortar, escalar a 20×20 manteniendo proporción y centrar por centro de masa en 28×28 */
function preprocess() {
  const N = 280, d = padG.getImageData(0, 0, N, N).data, g0 = new Float32Array(N * N);
  let minx = N, miny = N, maxx = -1, maxy = -1;
  for (let i = 0; i < N * N; i++) {
    const v = d[i * 4] / 255; g0[i] = v;
    if (v > 0.08) { const xx = i % N, yy = (i / N) | 0; if (xx < minx) minx = xx; if (xx > maxx) maxx = xx; if (yy < miny) miny = yy; if (yy > maxy) maxy = yy; }
  }
  const out = new Float32Array(784);
  if (maxx < 0) return { x: out, empty: true };
  const bw = maxx - minx + 1, bh = maxy - miny + 1, sc = 20 / Math.max(bw, bh);
  const tw = Math.max(1, Math.round(bw * sc)), th = Math.max(1, Math.round(bh * sc));
  const small = new Float32Array(tw * th);
  for (let ty = 0; ty < th; ty++) {
    const y0 = miny + ty / sc, y1 = miny + (ty + 1) / sc;
    for (let tx = 0; tx < tw; tx++) {
      const x0 = minx + tx / sc, x1 = minx + (tx + 1) / sc;
      let s = 0, n = 0;
      for (let yy = Math.floor(y0); yy < Math.max(Math.ceil(y1), Math.floor(y0) + 1); yy++) for (let xx = Math.floor(x0); xx < Math.max(Math.ceil(x1), Math.floor(x0) + 1); xx++) {
        if (xx < 0 || yy < 0 || xx >= N || yy >= N) continue; s += g0[yy * N + xx]; n++;
      }
      small[ty * tw + tx] = n ? s / n : 0;
    }
  }
  let m = 0, cx = 0, cy = 0;
  for (let ty = 0; ty < th; ty++) for (let tx = 0; tx < tw; tx++) { const v = small[ty * tw + tx]; m += v; cx += v * tx; cy += v * ty; }
  cx /= m || 1; cy /= m || 1;
  const ox = Math.round(13.5 - cx), oy = Math.round(13.5 - cy);
  let mx = 0;
  for (let ty = 0; ty < th; ty++) for (let tx = 0; tx < tw; tx++) {
    const X = tx + ox, Y = ty + oy; if (X < 0 || Y < 0 || X > 27 || Y > 27) continue;
    out[Y * 28 + X] = small[ty * tw + tx]; if (out[Y * 28 + X] > mx) mx = out[Y * 28 + X];
  }
  if (mx > 0) for (let i = 0; i < 784; i++) out[i] = Math.min(1, out[i] / mx);

}

function next() { const n = CH[S.ch].beats.length; if (S.beat < n - 1) go(S.ch, S.beat + 1); else if (S.ch < CH.length - 1) go(S.ch + 1, 0); else setPlaying(false); }
function prev() { if (S.beat > 0) go(S.ch, S.beat - 1); else if (S.ch > 0) go(S.ch - 1, CH[S.ch - 1].beats.length - 1); }
function setPlaying(v) { S.playing = v; $('#playBtn').innerHTML = v ? ICON_PAUSE + 'Pausa' : ICON_PLAY + 'Reproducir'; }

function renderExtras() { const b = CH[S.ch].beats[S.beat]; $('#extras').innerHTML = b.extras ? b.extras() : ''; }
function renderPanel() {
  const ch = CH[S.ch], b = ch.beats[S.beat];
  $('#eyebrow').textContent = `Capítulo ${S.ch + 1} de ${CH.length} · ${ch.title}`;
  $('#beatTitle').textContent = val(b.h);
  $('#beatText').innerHTML = val(b.text);
  const f = $('#formula');
  if (b.f) { f.innerHTML = val(b.f); f.hidden = false; } else f.hidden = true;
  renderExtras();
  $('#legend').innerHTML = ch.legend.map(([c, l]) => `<span style="--c:${c}">${l}</span>`).join('');
  $('#dots').innerHTML = ch.beats.map((_, i) => `<i class="${i === S.beat ? 'on' : i < S.beat ? 'done' : ''}"></i>`).join('');
  document.querySelectorAll('#chapters button').forEach((el, i) => {
    if (i === S.ch) el.setAttribute('aria-current', 'step'); else el.removeAttribute('aria-current');
    el.classList.toggle('seen', S.seen.has(i) && i !== S.ch);
  });
  $('#samples').style.visibility = ch.strip ? 'visible' : 'hidden';
  $('#prevBtn').disabled = S.ch === 0 && S.beat === 0;
  $('#nextBtn').disabled = S.ch === CH.length - 1 && S.beat === ch.beats.length - 1;
  S.readMs = Math.max(3500, $('#beatText').textContent.length * 48);
}

function buildNav() {
  $('#chapters').innerHTML = CH.map((c, i) => `<button type="button" data-ch="${i}"><span class="n">${i + 1}</span><span class="lbl">${c.title}</span></button>`).join('');
  $('#chapters').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.ch, 0); });
}
function paintThumb(c, k) {
  const g = c.getContext('2d'), img = g.createImageData(28, 28), X = DATA.test.X;
  for (let i = 0; i < 784; i++) { const v = X[k * 784 + i] * 255; img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255; }
  g.putImageData(img, 0, 0);
}
function buildSamples() {
  const el = $('#samples');
  el.innerHTML = '<span class="lbl">Dígito de entrada</span>';
  PICKS.forEach((k, d) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'thumb'; b.dataset.k = k; b.setAttribute('aria-label', `Usar un ${d}`); b.setAttribute('aria-pressed', 'false');
    const c = document.createElement('canvas'); c.width = c.height = 28; paintThumb(c, k); b.append(c); el.append(b);
  });
  el.insertAdjacentHTML('beforeend', '<button class="btn small" type="button" data-act="random">Aleatorio</button><button class="btn small" type="button" data-act="error">Un error de la red</button>');
  el.addEventListener('click', e => {
    const t = e.target.closest('.thumb'); if (t) setSample(+t.dataset.k);
  });
}
let errI = 0;
const ACTIONS = {
  random: () => setSample(Math.floor(Math.random() * 1000)),
  randomOk: () => { let k; do k = Math.floor(Math.random() * 1000); while (PRED[k] !== DATA.test.Y[k]); setSample(k); },
  error: () => { setSample(ERRS[errI++ % ERRS.length]); if (S.ch === 3 && S.beat !== 2) go(3, 2); },
  train: () => { if (!TR.done) TR.running = !TR.running; renderExtras(); },
  reset: () => { makeL5(); renderExtras(); renderPanel(); },
  speed: el => { TR.speed = +el.dataset.v; renderExtras(); },
  clear: () => { S6.fromSample = false; clearPad(); },
  sample6: () => padFromSample(Math.floor(Math.random() * 1000)),
  'net-pre': () => { S6.net = 'pre'; S6.dirty = true; renderExtras(); },
  'net-live': () => { S6.net = 'live'; S6.dirty = true; renderExtras(); },
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACTIONS[b.dataset.act]) ACTIONS[b.dataset.act](b); });

/* ======================================================================
   Escenario, puntero y bucle de animación
   ====================================================================== */
const stage = $('#stage'), g = stage.getContext('2d'), wrap = $('#stageWrap');
let SC = 1, DPR = 1;
function resize() {
  const r = wrap.getBoundingClientRect();
  const sc = Math.min(r.width / VW, r.height / VH) || 0.5;
  const w = Math.floor(VW * sc), h = Math.floor(VH * sc);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  DPR = Math.min(2, window.devicePixelRatio || 1);
  stage.width = Math.max(1, Math.round(w * DPR)); stage.height = Math.max(1, Math.round(h * DPR));
  SC = sc;
}
new ResizeObserver(resize).observe(wrap);
resize();

const toV = e => { const r = stage.getBoundingClientRect(); return { x: ((e.clientX - r.left) / r.width) * VW, y: ((e.clientY - r.top) / r.height) * VH }; };
const inPad = p => p.x >= PAD.x && p.x < PAD.x + PAD.s && p.y >= PAD.y && p.y < PAD.y + PAD.s;
const padPt = p => ({ x: ((p.x - PAD.x) / PAD.s) * 280, y: ((p.y - PAD.y) / PAD.s) * 280 });
let drawing = false, lastPt = null;
stage.addEventListener('pointerdown', e => {
  const p = toV(e);
  if (S.ch === 5 && inPad(p)) {
    if (S6.fromSample) { S6.fromSample = false; clearPad(); }
    drawing = true; lastPt = padPt(p); padStroke(lastPt, lastPt);
    stage.setPointerCapture(e.pointerId); e.preventDefault();
  }
});
stage.addEventListener('pointermove', e => {
  const p = toV(e); S.mouse.x = p.x; S.mouse.y = p.y; S.mouse.in = e.pointerType === 'mouse' || drawing;
  if (drawing) { const q = padPt(p); padStroke(lastPt, q); lastPt = q; }
});
const endDraw = () => { drawing = false; };
stage.addEventListener('pointerup', endDraw);
stage.addEventListener('pointercancel', endDraw);
stage.addEventListener('pointerleave', () => { S.mouse.in = false; });

document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea') || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { next(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { prev(); e.preventDefault(); }
  else if (e.key === ' ' && !e.target.closest('button')) { setPlaying(!S.playing); e.preventDefault(); }
  else if (/^[1-6]$/.test(e.key)) go(+e.key - 1, 0);
});
$('#nextBtn').addEventListener('click', next);
$('#prevBtn').addEventListener('click', prev);
$('#playBtn').addEventListener('click', () => setPlaying(!S.playing));
$('#fsBtn').addEventListener('click', () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else { const p = document.documentElement.requestFullscreen?.(); if (p) p.catch(() => {}); }
  } catch (err) { /* el marco puede no permitirlo */ }
});

let lastNow = 0;
function loop(now) {
  requestAnimationFrame(loop);
  drawFrame(now);
}
function drawFrame(now) {
  S.frameNo++;
  const dt = lastNow ? now - lastNow : 16; lastNow = now;
  const t = now - S.t0, b = CH[S.ch].beats[S.beat];
  if (S.playing && b.auto !== false && t > (b.dur || 1000) + S.readMs) next();
  if (S.ch === 4 && S.beat === 4) trainTick(dt);
  g.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0);
  g.fillStyle = rgba(RGB.stage); g.fillRect(0, 0, VW, VH);
  HOV.length = 0;
  CH[S.ch].draw(g, S.beat, t);
  drawHover(g);
}

async function boot() {
  NET = MLP.fromModel(MODEL);
  for (let k = 0; k < 16; k++) { let m = 1e-6; for (let i = 0; i < 784; i++) m = Math.max(m, Math.abs(NET.W[0][k * 784 + i])); WMAX.push(m); }
  const [XT, XR] = await Promise.all([loadSprite(TEST_SPRITE, 1000), loadSprite(TRAIN_SPRITE, 6000)]);
  DATA = {
    test: { X: XT, Y: Uint8Array.from(MODEL.testLabels, c => +c), n: 1000 },
    train: { X: XR, Y: Uint8Array.from(MODEL.trainLabels, c => +c), n: 6000 },
  };
  const act = [new Array(16).fill(0), new Array(16).fill(0)];
  for (let k = 0; k < 1000; k++) {
    const F = NET.forward(XT.subarray(k * 784, k * 784 + 784)); PRED.push(F.pred); CONF.push(F.p[F.pred]);
    if (F.pred !== DATA.test.Y[k]) ERRS.push(k);
    for (let l = 0; l < 2; l++) F.a[l + 1].forEach((v, i) => { if (v > 0) act[l][i]++; });
  }
  act.forEach((c, l) => c.forEach((n, i) => { if (n === 0) DEAD[l].add(i); }));
  for (let d = 0; d < 10; d++) { let best = -1; for (let k = 0; k < 1000; k++) if (DATA.test.Y[k] === d && PRED[k] === d && CONF[k] > 0.97) { best = k; break; } PICKS.push(best >= 0 ? best : DATA.test.Y.indexOf(d)); }
  LIVE = new MLP(ARCH); LIVE.randomize(SEED);
  TRAINER = new Trainer(LIVE, DATA.train.X, DATA.train.Y, 6000, 99);
  buildNav(); buildSamples();
  setSample(PICKS[3], false);
  setPlaying(false);
  const m = /^#capitulo([1-6])$/.exec(location.hash);
  go(m ? +m[1] - 1 : 0, 0);
  $('#loading').hidden = true;
  window.__mnist = { NET, DATA, analyze, render: () => { const t = performance.now(); drawFrame(t); return performance.now() - t; } };  // para inspección desde la consola
  requestAnimationFrame(loop);
}
boot().catch(err => { $('#loading').textContent = 'No se pudieron cargar los datos: ' + err.message; });
})();
</script>
